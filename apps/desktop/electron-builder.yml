appId: dev.openpencil.app
productName: OpenPencil
copyright: Copyright (c) 2024-2026 OpenPencil contributors

directories:
  output: out/release
  buildResources: apps/desktop/build

files:
  - package.json
  - out/desktop/**/*
  - '!**/node_modules/**'
  - '!**/.git/**'

extraResources:
  - from: out/web/server
    to: server
  - from: out/web/public
    to: public
  - from: out/mcp-server.cjs
    to: mcp-server.cjs
  - from: apps/cli/dist/openpencil-cli.cjs
    to: openpencil-cli.cjs
  # agent-native 在 Vite/Nitro 构建中是外部的 - 将其与 server/ 一起发送，因此 Node 可以在运行时解析
  # `@zseven-w/agent-native`。 The `napi/` 目录 IS 包根目录（包含名为“@zseven-w/agent-nativ
  # e”的 package.json 和由 agent-native:bundle 脚本复制的 agent_napi.node）。
  - from: packages/agent-native/napi
    to: server/node_modules/@zseven-w/agent-native

mac:
  category: public.app-category.graphics-design
  icon: apps/desktop/build/icon.icns
  artifactName: '${productName}-${version}-${arch}-mac.${ext}'
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # 当前 CI 暂无 Apple Developer 签名/公证凭据，先关闭 notarize，保证 unsigned
  # 构建可以稳定产出。后续配置好签名密钥后再恢复为 true。
  notarize: false

dmg:
  title: '${productName} ${version}'

win:
  icon: apps/desktop/build/icon.ico
  artifactName: '${productName}-${version}-${arch}-win.${ext}'
  target:
    - nsis
    - portable

nsis:
  artifactName: '${productName}-${version}-${arch}-win-setup.${ext}'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: apps/desktop/build/icon.png
  category: Graphics
  artifactName: '${productName}-${version}-${arch}-linux.${ext}'
  desktop:
    entry: |
      [Desktop Entry]
      Name=OpenPencil
      Exec=AppRun --no-sandbox %U
      Terminal=false
      Type=Application
      Icon=openpencil
      StartupWMClass=openpencil
      Categories=Graphics;
      MimeType=application/x-openpencil;
  target:
    - AppImage
    - deb

fileAssociations:
  - ext: op
    name: OpenPencil Document
    description: OpenPencil Design File
    mimeType: application/x-openpencil
    role: Editor
    icon: apps/desktop/build/icon

protocols:
  - name: OpenPencil Cloud Auth
    schemes:
      - openpencil

asar: true
