services:
  openpencil:
    image: ${OPENPENCIL_IMAGE:?OPENPENCIL_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD-SHELL
        - "bun -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      openpencil:
        condition: service_started
    env_file:
      - .env
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
