# Cross-compilation config for `cross` (used by the linux-aarch64 CI job).
#
# The aarch64 cross build links the `openpencil-desktop` binary, which pulls
# system freetype + fontconfig at link time (via skia-bindings and
# sctk-adwaita). The stock cross image only ships host-arch libs, so the
# target-arch dev packages must be installed into the container before build.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libfreetype-dev:$CROSS_DEB_ARCH libfontconfig1-dev:$CROSS_DEB_ARCH",
]
