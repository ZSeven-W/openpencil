# cargo-deny config — pinned to ≥ 0.16 schema
# Validated via openpencil-docs/superpowers/notes/2026-05-02-cargo-deny-validation.md

[graph]
all-features = false
# 限定到实际发布目标（macOS/Linux/Windows native + wasm32）。
# 不限定的话 cargo-deny 默认尝试所有 target（含 Android/iOS），
# 拉进 jni / android-activity 等 edition-2024 deps，在 rustc 1.82 上 cargo metadata 失败。
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "wasm32-unknown-unknown" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Zlib",
]
confidence-threshold = 0.93

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
# workspace 内部 path 依赖不写 version（标准实践，避免每次 bump 都改两处）。
# 没有 crate 发布到 crates.io，wildcard path deps 是预期的，故 allow。
wildcards = "allow"
allow-wildcard-paths = true
deny = [
  # WASM bundle 黑名单（kickoff spec §1.2 invariant）。
  # `agent` 不在此列：它是 op-host-desktop（桌面二进制，永不编译到 wasm）的
  # native-only 依赖；wasm 隔离是结构性的（op-host-web 不依赖它）并由
  # tools/check-wasm-bundle.sh 验证。
  "pen-agent-cli",
  "pen-server",
  "native-tls",
]

# 不再禁用 tokio 的 process / rt-multi-thread feature：op-host-desktop
# 的原生 agent runtime（async）合法地需要它们。wasm 侧结构性安全——
# 这两个 feature 依赖 OS 线程/进程，无法编译到 wasm32——并由
# tools/check-wasm-bundle.sh 验证。

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# agent-rs 现在通过 vendor/agent submodule 以 path 依赖引入，不再是 git 依赖。
allow-git = []
