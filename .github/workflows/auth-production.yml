name: Auth production promotion

# This public workflow is the only holder of the production provenance root.
# The private repository rebuilds and audits ten unsigned candidates, then this
# protected environment authenticates one exact successful private workflow
# run, verifies every candidate before the root is referenced, signs the whole
# matrix on a dedicated runner, and creates the auth-only child A of exact S on
# a different runner. No runner ever receives two production credentials.
#
# Configure the `auth-production` environment with required reviewers and only
# the reviewed main and v* branch deployment policy.
#
# Environment secrets:
# - OP_AUTH_CANDIDATE_READ_TOKEN: fine-grained token with Actions read access
#   only to ZSeven-W/op-platform and no OpenPencil write permission.
# - OP_AUTH_PROVENANCE_SIGNING_KEY_PEM: Ed25519 PKCS#8 production root.
# - OPENPENCIL_AUTH_PUSH_TOKEN: fine-grained contents-write token only for
#   ZSeven-W/openpencil, owned by the reviewed main-ruleset bypass identity.

on:
  workflow_dispatch:
    inputs:
      private_run_id:
        description: Exact successful op-platform prebuilt-production workflow run ID
        required: true
        type: string
      private_head_sha:
        description: Exact 40-character op-platform head SHA for that workflow run
        required: true
        type: string
      openpencil_sha:
        description: Exact 40-character public source commit S to receive auth-only child A
        required: true
        type: string
      target_branch:
        description: Existing public branch at S (main or exact v<workspace-version>)
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-production-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release identities
    if: github.repository == 'ZSeven-W/openpencil'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      openpencil_sha: ${{ steps.policy.outputs.openpencil_sha }}
      target_branch: ${{ steps.policy.outputs.target_branch }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout reviewed promotion implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: promotion-tools

      - name: Validate dispatch syntax and exact remote branch lease
        id: identity
        shell: bash
        env:
          RAW_PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
          RAW_PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          RAW_OPENPENCIL_SHA: ${{ inputs.openpencil_sha }}
          RAW_TARGET_BRANCH: ${{ inputs.target_branch }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash promotion-tools/tools/validate-auth-promotion-identity.sh \
            --private-run-id "$RAW_PRIVATE_RUN_ID" \
            --private-head-sha "$RAW_PRIVATE_HEAD_SHA" \
            --openpencil-sha "$RAW_OPENPENCIL_SHA" \
            --target-branch "$RAW_TARGET_BRANCH" \
            --workflow-sha "$WORKFLOW_SHA" \
            --workflow-ref "$WORKFLOW_REF"
          {
            echo "openpencil_sha=$RAW_OPENPENCIL_SHA"
            echo "target_branch=$RAW_TARGET_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact public source S without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ steps.identity.outputs.openpencil_sha }}
          path: public-source

      - name: Bind branch policy to the exact workspace version
        id: policy
        shell: bash
        env:
          OPENPENCIL_SHA: ${{ steps.identity.outputs.openpencil_sha }}
          TARGET_BRANCH: ${{ steps.identity.outputs.target_branch }}
        run: |
          set -euo pipefail
          [[ "$(git -C public-source rev-parse HEAD)" == "$OPENPENCIL_SHA" ]]
          [[ -z "$(git -C public-source status --porcelain)" ]]
          version=$(public-source/scripts/workspace-version.sh)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          if [[ "$TARGET_BRANCH" != main && "$TARGET_BRANCH" != "v$version" ]]; then
            echo "::error::version branch does not match the exact workspace version"
            exit 1
          fi
          {
            echo "openpencil_sha=$OPENPENCIL_SHA"
            echo "target_branch=$TARGET_BRANCH"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Prove promotion gates fail closed
        shell: bash
        run: |
          set -euo pipefail
          bash promotion-tools/tools/check-auth-production-workflow.sh
          bash promotion-tools/tools/check-op-auth-promotion.test.sh

  acquire_candidates:
    name: Acquire and seal verified unsigned candidates
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: auth-production
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload_candidates.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload_candidates.outputs.artifact-id }}
      build_id: ${{ steps.candidates.outputs.build_id }}
      tree_digest: ${{ steps.candidates.outputs.tree_digest }}
    steps:
      - name: Checkout exact reviewed acquisition implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.openpencil_sha }}
          path: promotion-tools

      - name: Download exact immutable private candidate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OP_AUTH_CANDIDATE_READ_TOKEN }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
        run: |
          set -euo pipefail
          bash promotion-tools/tools/download-op-auth-candidates.sh \
            --private-run-id "$PRIVATE_RUN_ID" \
            --private-head-sha "$PRIVATE_HEAD_SHA" \
            --output-root candidates

      - name: Verify candidates and compute the immutable handoff digest
        id: candidates
        shell: bash
        env:
          OPENPENCIL_SHA: ${{ needs.validate.outputs.openpencil_sha }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bash promotion-tools/tools/verify-op-auth-candidates.sh \
            --candidate-root candidates \
            --private-run-id "$PRIVATE_RUN_ID" \
            --private-head-sha "$PRIVATE_HEAD_SHA" \
            --openpencil-sha "$OPENPENCIL_SHA" \
            --version "$VERSION"
          build_id=$(sed -n 's/^build_id=//p' \
            candidates/aarch64-apple-darwin/CANDIDATE)
          [[ "$build_id" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]{0,57}[A-Za-z0-9])?$ ]]
          tree_digest=$(python3 \
            promotion-tools/tools/digest-op-auth-tree.py --root candidates)
          [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]]
          chmod -R a-w candidates
          {
            echo "build_id=$build_id"
            echo "tree_digest=$tree_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the immutable verified candidate handoff
        id: upload_candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-op-auth-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidates/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  sign:
    name: Sign on a root-only ephemeral runner
    needs: [validate, acquire_candidates]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: auth-production
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload_signed.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload_signed.outputs.artifact-id }}
      tree_digest: ${{ steps.signed.outputs.tree_digest }}
    steps:
      - name: Checkout exact reviewed signer implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.openpencil_sha }}
          path: promotion-tools

      - name: Checkout exact public source S without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.openpencil_sha }}
          path: public-source

      - name: Validate the exact candidate handoff identity
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.acquire_candidates.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.acquire_candidates.outputs.artifact_id }}
          BUILD_ID: ${{ needs.acquire_candidates.outputs.build_id }}
          TREE_DIGEST: ${{ needs.acquire_candidates.outputs.tree_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TREE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]{0,57}[A-Za-z0-9])?$ ]]

      - name: Download the exact immutable candidate handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.acquire_candidates.outputs.artifact_id }}
          path: candidates
          merge-multiple: true

      - name: Independently revalidate the candidate handoff
        shell: bash
        env:
          BUILD_ID: ${{ needs.acquire_candidates.outputs.build_id }}
          OPENPENCIL_SHA: ${{ needs.validate.outputs.openpencil_sha }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
          TREE_DIGEST: ${{ needs.acquire_candidates.outputs.tree_digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          python3 promotion-tools/tools/digest-op-auth-tree.py \
            --root candidates --expected "$TREE_DIGEST"
          bash promotion-tools/tools/verify-op-auth-candidates.sh \
            --candidate-root candidates \
            --private-run-id "$PRIVATE_RUN_ID" \
            --private-head-sha "$PRIVATE_HEAD_SHA" \
            --openpencil-sha "$OPENPENCIL_SHA" \
            --version "$VERSION"
          actual_build_id=$(sed -n 's/^build_id=//p' \
            candidates/aarch64-apple-darwin/CANDIDATE)
          [[ "$actual_build_id" == "$BUILD_ID" ]]
          chmod -R a-w candidates

      - name: Sign the verified matrix and delete the root immediately
        shell: bash
        env:
          BUILD_ID: ${{ needs.acquire_candidates.outputs.build_id }}
          OPENPENCIL_SHA: ${{ needs.validate.outputs.openpencil_sha }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          ROOT_SIGNING_KEY_PEM: ${{ secrets.OP_AUTH_PROVENANCE_SIGNING_KEY_PEM }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$ROOT_SIGNING_KEY_PEM" ]] || {
            echo "::error::production provenance root is not configured"
            exit 2
          }
          [[ "$(git -C public-source rev-parse HEAD)" == "$OPENPENCIL_SHA" ]]
          [[ -z "$(git -C public-source status --porcelain)" ]]
          trusted_key=public-source/crates/op-auth-bridge/prebuilt/PROVENANCE_PUBKEY
          [[ -f "$trusted_key" && ! -L "$trusted_key" ]]
          key_file=$(mktemp "$RUNNER_TEMP/op-auth-production-key.XXXXXX")
          cleanup_key() {
            if [[ -n "${key_file:-}" ]]; then
              rm -f "$key_file"
            fi
          }
          trap cleanup_key EXIT HUP INT TERM
          chmod 600 "$key_file"
          printf '%s' "$ROOT_SIGNING_KEY_PEM" > "$key_file"
          unset ROOT_SIGNING_KEY_PEM

          bash promotion-tools/tools/sign-op-auth-candidates.sh \
            --candidate-root candidates \
            --trusted-public-key "$trusted_key" \
            --signing-key "$key_file" \
            --output-root signed-matrix \
            --version "$VERSION" \
            --private-head-sha "$PRIVATE_HEAD_SHA" \
            --openpencil-sha "$OPENPENCIL_SHA" \
            --build-id "$BUILD_ID"

          rm -f "$key_file"
          key_file=
          trap - EXIT HUP INT TERM

      - name: Verify signed bytes and compute the immutable handoff digest
        id: signed
        shell: bash
        env:
          BUILD_ID: ${{ needs.acquire_candidates.outputs.build_id }}
          OPENPENCIL_SHA: ${{ needs.validate.outputs.openpencil_sha }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          trusted_key=public-source/crates/op-auth-bridge/prebuilt/PROVENANCE_PUBKEY
          bash promotion-tools/tools/verify-signed-op-auth-matrix.sh \
            --signed-root signed-matrix \
            --trusted-public-key "$trusted_key" \
            --version "$VERSION" \
            --private-head-sha "$PRIVATE_HEAD_SHA" \
            --openpencil-sha "$OPENPENCIL_SHA" \
            --build-id "$BUILD_ID"
          tree_digest=$(python3 \
            promotion-tools/tools/digest-op-auth-tree.py --root signed-matrix)
          [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]]
          chmod -R a-w signed-matrix
          echo "tree_digest=$tree_digest" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable signed matrix handoff
        id: upload_signed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-op-auth-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-matrix/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  promote:
    name: Verify and push on a write-only ephemeral runner
    needs: [validate, acquire_candidates, sign]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: auth-production
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed promotion implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.openpencil_sha }}
          path: promotion-tools

      - name: Checkout exact public source S without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.validate.outputs.openpencil_sha }}
          path: public-source

      - name: Validate the exact signed handoff identity
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.sign.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
          BUILD_ID: ${{ needs.acquire_candidates.outputs.build_id }}
          TREE_DIGEST: ${{ needs.sign.outputs.tree_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TREE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BUILD_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]{0,57}[A-Za-z0-9])?$ ]]

      - name: Download the exact immutable signed handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: signed-matrix
          merge-multiple: true

      - name: Verify signed bytes, create A, and push with an exact S lease
        id: promotion
        shell: bash
        env:
          BUILD_ID: ${{ needs.acquire_candidates.outputs.build_id }}
          GH_TOKEN: ${{ secrets.OPENPENCIL_AUTH_PUSH_TOKEN }}
          OPENPENCIL_SHA: ${{ needs.validate.outputs.openpencil_sha }}
          PRIVATE_HEAD_SHA: ${{ inputs.private_head_sha }}
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
          SIGNED_TREE_DIGEST: ${{ needs.sign.outputs.tree_digest }}
          TARGET_BRANCH: ${{ needs.validate.outputs.target_branch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # This fresh runner never held the production root or private token.
          # It runs no Cargo command and never executes a candidate archive.
          python3 promotion-tools/tools/digest-op-auth-tree.py \
            --root signed-matrix --expected "$SIGNED_TREE_DIGEST"
          trusted_key=public-source/crates/op-auth-bridge/prebuilt/PROVENANCE_PUBKEY
          [[ -f "$trusted_key" && ! -L "$trusted_key" ]]
          bash promotion-tools/tools/verify-signed-op-auth-matrix.sh \
            --signed-root signed-matrix \
            --trusted-public-key "$trusted_key" \
            --version "$VERSION" \
            --private-head-sha "$PRIVATE_HEAD_SHA" \
            --openpencil-sha "$OPENPENCIL_SHA" \
            --build-id "$BUILD_ID"

          prefix=crates/op-auth-bridge/prebuilt
          source promotion-tools/tools/op-auth-candidate-targets.sh
          while IFS= read -r target; do
            rm -rf "public-source/$prefix/$target"
            cp -R "signed-matrix/$target" "public-source/$prefix/$target"
          done < <(op_auth_candidate_targets)
          cp signed-matrix/RELEASE-MANIFEST "public-source/$prefix/RELEASE-MANIFEST"
          cp signed-matrix/RELEASE-MANIFEST.sig "public-source/$prefix/RELEASE-MANIFEST.sig"
          git -C public-source diff --exit-code -- "$prefix/PROVENANCE_PUBKEY"
          cmp -s "$trusted_key" \
            promotion-tools/crates/op-auth-bridge/prebuilt/PROVENANCE_PUBKEY
          OP_AUTH_PREBUILT_ROOT="$PWD/public-source/$prefix" \
          OP_AUTH_RELEASE_EXPECTED_OPENPENCIL_REVISION="$OPENPENCIL_SHA" \
          OP_AUTH_RELEASE_WORKSPACE_VERSION="$VERSION" \
            bash promotion-tools/tools/check-op-auth-release-matrix.sh
          OP_AUTH_PREBUILT_ROOT="$PWD/public-source/$prefix" \
            bash promotion-tools/tools/check-op-auth-prebuilt.sh --require-hardened
          git -C public-source add -A "$prefix"
          bash promotion-tools/tools/verify-op-auth-promotion-diff.sh \
            --repo public-source \
            --expected-parent "$OPENPENCIL_SHA"

          git -C public-source config core.hooksPath /dev/null
          git -C public-source config commit.gpgsign false
          git -C public-source config user.name openpencil-auth-production
          git -C public-source config user.email ci@zseven.cn
          git -C public-source commit \
            -m 'feat(auth): promote signed complete op-auth ABI v3 matrix' \
            -m "Private workflow run: $PRIVATE_RUN_ID" \
            -m "Private source revision: $PRIVATE_HEAD_SHA" \
            -m "Release build id: $BUILD_ID"
          auth_sha=$(git -C public-source rev-parse HEAD)
          [[ "$(git -C public-source rev-parse HEAD^)" == "$OPENPENCIL_SHA" ]]
          [[ "$(git -C public-source rev-list --parents -n 1 HEAD | awk '{ print NF }')" -eq 2 ]]
          [[ -z "$(git -C public-source status --porcelain)" ]]

          gh auth setup-git
          git -C public-source push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$OPENPENCIL_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "promoted_sha=$auth_sha" >> "$GITHUB_OUTPUT"
          echo "Promoted auth-only commit A: $auth_sha"
