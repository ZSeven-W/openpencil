name: iOS App Store / TestFlight

# The formal Rust release calls this workflow once for every v* release tag.
# A rejected or otherwise replaced build can be uploaded independently with
# workflow_dispatch from the default branch by supplying the exact version
# tag/branch ref and its full source commit SHA. The secret-free verify job
# resolves the canonical remote ref, requires it to select that source, and
# verifies the signed Auth matrix already committed in the same source tree.
#
# The `testflight` environment must require a reviewer and allow only protected
# release tags/branches. Store signing and App Store Connect credentials as its
# secrets. The repository's existing team and relay values remain secrets and
# are referenced only by the protected publish job.
#
# Environment secrets:
# - IOS_DISTRIBUTION_CERTIFICATE_BASE64
# - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
# - IOS_PROVISIONING_PROFILE_BASE64
# - APP_STORE_CONNECT_API_KEY_BASE64
# - APP_STORE_CONNECT_API_KEY_ID
# - APP_STORE_CONNECT_ISSUER_ID
#
# Existing repository secrets (used only after environment approval):
# - APPLE_TEAM_ID
# - OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN
# - OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL
#
# The App Store encryption questionnaire concluded that this build needs no
# export-compliance documents. The Xcode project therefore source-controls
# ITSAppUsesNonExemptEncryption=NO and deliberately carries no compliance code.

on:
  workflow_call:
    inputs:
      release_sha:
        description: Full SHA of the exact source commit to build
        required: true
        type: string
      release_ref:
        description: Exact refs/tags/vX.Y.Z or refs/heads/vX.Y.Z for the source
        required: true
        type: string
    secrets:
      APPLE_TEAM_ID:
        description: Apple Developer team identifier
        required: true
      OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN:
        description: Reviewed China collaboration bootstrap URL
        required: true
      OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL:
        description: Reviewed global collaboration bootstrap URL
        required: true
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the exact source commit to build
        required: true
        type: string
      release_ref:
        description: Exact refs/tags/vX.Y.Z or refs/heads/vX.Y.Z for the source
        required: true
        type: string

run-name: >-
  App Store / TestFlight ${{ inputs.release_ref }} @ ${{ inputs.release_sha }}

permissions:
  contents: read

concurrency:
  group: ios-app-store-tech-zseven-openpencil
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable source and auth matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      build_number: ${{ steps.release.outputs.build_number }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Bind requested source to the trusted trigger ref before checkout
        shell: bash
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_sha must be a full lowercase commit SHA"
            exit 2
          }
          [[ "$REQUESTED_RELEASE_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::release_sha must equal the workflow trigger SHA"
            exit 2
          }
          [[ "$REQUESTED_RELEASE_REF" == "$GITHUB_REF" ]] || {
            echo "::error::release_ref must equal the workflow trigger ref"
            exit 2
          }
          [[ "$GITHUB_REF" =~ ^refs/(heads|tags)/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::App Store publication requires an exact stable vX.Y.Z ref"
            exit 2
          }

      - name: Checkout the exact release source without credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate the exact canonical source and release version
        id: release
        shell: bash
        env:
          OPENPENCIL_RELEASE_SHA: ${{ inputs.release_sha }}
          OPENPENCIL_RELEASE_REF: ${{ inputs.release_ref }}
          OPENPENCIL_CANONICAL_REMOTE: https://github.com/ZSeven-W/openpencil.git
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$OPENPENCIL_RELEASE_SHA" ]] || {
            echo "::error::checkout does not match the requested release source"
            exit 1
          }
          tools/check-op-auth-remote-ref.sh --self-test
          tools/check-op-auth-remote-ref.sh
          tools/ios-build-number.sh --self-test
          version=$(scripts/workspace-version.sh)
          case "$OPENPENCIL_RELEASE_REF" in
            "refs/heads/v$version"|"refs/tags/v$version") ;;
            *)
              echo "::error::release ref must exactly match workspace version v$version"
              exit 2
              ;;
          esac
          build_number=$(tools/ios-build-number.sh)
          [[ "$build_number" =~ ^[1-9][0-9]{0,3}\.([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$ ]]
          echo "source_sha=$OPENPENCIL_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Verify signed ABI 3 release matrix and hardened symbol surface
        shell: bash
        run: |
          set -euo pipefail
          tools/check-ios-app-store-workflow.sh
          tools/check-release-workflow-policy.test.sh ios
          tools/check-op-auth-release-matrix.test.sh
          tools/check-op-auth-release-matrix.sh
          tools/check-op-auth-prebuilt.sh --require-hardened
          CONFIGURATION=Release \
          OP_AUTH_ARCHIVE="$GITHUB_WORKSPACE/crates/op-auth-bridge/prebuilt/aarch64-apple-ios/libop_auth.a" \
          OP_AUTH_TARGET=aarch64-apple-ios \
            tools/check-mobile-auth-link-input.sh

  publish:
    name: Archive, sign, and upload
    needs: verify
    runs-on: macos-26
    timeout-minutes: 120
    environment: testflight
    steps:
      - name: Checkout the exact release source without credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.verify.outputs.source_sha }}
          submodules: recursive

      - name: Install pinned Rust toolchain and iOS target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94 --profile minimal
          rustup target add --toolchain 1.94 aarch64-apple-ios

      - name: Install digest-pinned XcodeGen
        id: xcodegen
        shell: bash
        env:
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-2.45.4.zip"
          install_root="$RUNNER_TEMP/xcodegen-2.45.4"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --silent --show-error "$XCODEGEN_URL" --output "$archive"
          actual=$(shasum -a 256 "$archive" | awk '{ print $1 }')
          [[ "$actual" == "$XCODEGEN_SHA256" ]] || {
            echo "::error::XcodeGen archive digest mismatch"
            exit 1
          }
          ditto -x -k "$archive" "$install_root"
          binary="$install_root/xcodegen/bin/xcodegen"
          [[ -x "$binary" && ! -L "$binary" ]]
          [[ "$($binary --version)" == 'Version: 2.45.4' ]]
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Stage digest-pinned iOS Skia binary cache
        shell: bash
        run: >-
          tools/pinned-release-tools.sh skia ios aarch64-apple-ios
          "$RUNNER_TEMP/openpencil-skia-aarch64-apple-ios"

      - name: Validate Xcode 26, iOS 26 SDK, and source before credentials are exposed
        shell: bash
        run: |
          set -euo pipefail
          xcode_version=$(xcodebuild -version)
          printf '%s\n' "$xcode_version"
          xcode_header=${xcode_version%%$'\n'*}
          if [[ ! $xcode_header =~ ^Xcode[[:space:]]+([0-9]+)([.][0-9]+)*$ ]]; then
            echo "::error::could not parse the selected Xcode version"
            exit 1
          fi
          xcode_major=${BASH_REMATCH[1]}
          if (( xcode_major < 26 )); then
            echo "::error::App Store Connect requires Xcode 26 or newer"
            exit 1
          fi
          iphoneos_sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          if [[ ! $iphoneos_sdk_version =~ ^([0-9]+)([.][0-9]+)*$ ]]; then
            echo "::error::could not parse the selected iPhoneOS SDK version"
            exit 1
          fi
          iphoneos_sdk_major=${BASH_REMATCH[1]}
          if (( iphoneos_sdk_major < 26 )); then
            echo "::error::App Store Connect requires the iOS 26 SDK or newer"
            exit 1
          fi
          printf 'iPhoneOS SDK %s\n' "$iphoneos_sdk_version"
          packaging/ios-player/Tests/validate_sources.sh

      - name: Validate protected production release configuration
        shell: bash
        env:
          RELAY_CN: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN }}
          RELAY_GLOBAL: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL }}
        run: |
          set -euo pipefail
          relay_cn=$RELAY_CN
          relay_global=$RELAY_GLOBAL
          unset RELAY_CN RELAY_GLOBAL
          printf '%s\0%s\0' "$relay_cn" "$relay_global" \
            | python3 tools/check-collab-bootstrap-urls.py
          echo "Validated the protected production release configuration."

      - name: Publish the collaboration-enabled build to TestFlight
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_MARKETING_VERSION: ${{ needs.verify.outputs.version }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_CN }}
          OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL: ${{ secrets.OPENPENCIL_BUILD_COLLAB_BOOTSTRAP_URL_GLOBAL }}
          OP_AUTH_ARTIFACT_ROOT: ${{ github.workspace }}/crates/op-auth-bridge/prebuilt
          XCODEGEN_BIN: ${{ steps.xcodegen.outputs.binary }}
        run: scripts/publish-ios-testflight.sh
