 } .metric-grid-type--work { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.6vw, 18px); } .metric-card--wide { grid-column: 1 / span 2; max-width: 240px; } .service-report__work-note { margin-top: clamp(14px, 2.2vw, 18px); font-size: clamp(14px, 2.8vw, 20px); line-height: 1.75; color: var(--report-text); } .service-report__message-banner { position: absolute; left: 50%; top: 0; width: 45.122%; height: clamp(44px, 8vw, 60px); transform: translateX(-50%); } .service-report__message-ribbon { width: 100%; height: 100%; display: block; } .service-report__message-title { position: absolute; inset: clamp(6px, 1vw, 7px) 0 auto 0; font-size: clamp(20px, 4.2vw, 30px); line-height: 1.467; font-weight: 400; letter-spacing: 7.2px; text-align: center; color: #ffffff; } .service-report__message-copy { font-size: clamp(16px, 3.4vw, 24px); line-height: 1.667; font-weight: 400; color: var(--report-text); white-space: pre-line; } .service-report__message-footer { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: clamp(18px, 3vw, 24px); } .service-report__quote-mark { width: clamp(96px, 19vw, 140px); aspect-ratio: 140 / 110.75; height: auto; flex: 0 0 auto; color: var(--report-quote); } .service-report__signature { max-width: 384px; margin-left: auto; font-size: clamp(16px, 3.4vw, 24px); line-height: 1.667; font-weight: 400; color: var(--report-text); text-align: right; white-space: pre-line; } @media (max-width: 639px) { .design-root { padding: 16px 8px; } .metric-grid-type--three, .metric-grid-type--work { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; } .metric-card--wide { grid-column: 1 / -1; max-width: none; } .service-report__message-footer { align-items: flex-start; flex-direction: column; } .service-report__signature { max-width: none; width: 100%; } } @media (min-width: 640px) { .report-stage { max-width: 711px; } } @media (min-width: 768px) { .design-root { padding: 28px 16px; } } @media (min-width: 1024px) { .design-root { padding: 32px 24px; } } @media (min-width: 1280px) { .design-root { padding: 40px 24px; } } </style> </head> <body> <main class=\"design-root\" aria-label=\"服务简报（2025年10月）\"> <div class=\"report-stage\"> <article class=\"service-report\"> <div class=\"service-report__blue-surface service-report__blue-surface--top\" aria-hidden=\"true\"></div> <div class=\"service-report__blue-surface service-report__blue-surface--bottom\" aria-hidden=\"true\"></div> <img class=\"service-report__hero-image\" src=\"./assets/image-2-1.png\" alt=\"服务简报背景图\" /> <header class=\"service-report__header\"> <h1 class=\"service-report__company-name\">培管（厦门）数字科技有限公司</h1> <div class=\"service-report__title-pill\" aria-hidden=\"true\"></div> <h2 class=\"service-report__title\">服务简报（2025年10月）</h2> </header> <section class=\"service-report__intro paper-panel-surface\" aria-labelledby=\"report-intro-heading\"> <p class=\"service-report__intro-copy\" id=\"report-intro-heading\"> 尊敬的客户，您好，现就您的企业“培管（厦门）数字科技有限公司”2025年10月的服务情况做简要汇报： </p> </section> <section class=\"service-report__overview report-panel paper-panel-surface\" aria-labelledby=\"report-overview-title\"> <header class=\"report-panel__header\"> <div class=\"report-panel__index\" aria-hidden=\"true\"> <p class=\"report-panel__index-text\">1</p> </div> <h2 class=\"section-heading-type\" id=\"report-overview-title\">月度票财税基本情况</h2> </header> <div class=\"service-report__overview-body\"> <section class=\"report-subsection report-subsection--invoice\" aria-labelledby=\"report-invoice-title\"> <div class=\"report-subsection__header\"> <svg class=\"report-accent-bars\" viewBox=\"0 0 44 19\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <path d=\"M7.2082 0L17.62 0L10.4118 19L0 19L7.2082 0ZM20.3732 0L30.785 0L23.5768 19L13.165 19L20.3732 0ZM33.5882 0L44 0L36.7918 19L26.38 19L33.5882 0Z\"></path> </svg> <h3 class=\"report-subsection__title\" id=\"report-invoice-title\">发票</h3> </div> <div class=\"metric-grid-type metric-grid-type--two\"> <article class=\"metric-card\"> <p class=\"metric-card__label\">收票（4份）</p> <p class=\"metric-card__value\">82.35</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">开票（--份）</p> <p class=\"metric-card__value\">--</p> </article> </div> </section> <hr class=\"report-divider\" /> <section class=\"report-subsection report-subsection--work\" aria-labelledby=\"report-work-title\"> <div class=\"report-subsection__header\"> <svg class=\"report-accent-bars\" viewBox=\"0 0 44 19\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <path d=\"M7.2082 0L17.62 0L10.4118 19L0 19L7.2082 0ZM20.3732 0L30.785 0L23.5768 19L13.165 19L20.3732 0ZM33.5882 0L44 0L36.7918 19L26.38 19L33.5882 0Z\"></path> </svg> <h3 class=\"report-subsection__title\" id=\"report-work-title\">工作简报</h3> </div> <div class=\"metric-grid-type metric-grid-type--work\"> <article class=\"metric-card\"> <p class=\"metric-card__label\">已录入发票（份）</p> <p class=\"metric-card__value\">4</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">已录入凭证（张）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">已录入流水（条）</p> <p class=\"metric-card__value\">--</p> </article> </div> <p class=\"service-report__work-note\"> 本月持续完成票据归集、凭证核对与流水整理，关键财税数据已同步更新，线上协同保持畅通。 </p> </section> <hr class=\"report-divider\" /> <section class=\"report-subsection report-subsection--finance\" aria-labelledby=\"report-finance-title\"> <div class=\"report-subsection__header\"> <svg class=\"report-accent-bars\" viewBox=\"0 0 44 19\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <path d=\"M7.2082 0L17.62 0L10.4118 19L0 19L7.2082 0ZM20.3732 0L30.785 0L23.5768 19L13.165 19L20.3732 0ZM33.5882 0L44 0L36.7918 19L26.38 19L33.5882 0Z\"></path> </svg> <h3 class=\"report-subsection__title\" id=\"report-finance-title\">财务简报</h3> </div> <div class=\"metric-grid-type metric-grid-type--three\"> <article class=\"metric-card\"> <p class=\"metric-card__label\">资产（元）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">负债（元）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">资产负债率（%）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">收入（元）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">成本（元）</p> <p class=\"metric-card__value\">2</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">利润（元）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">存货（元）</p> <p class=\"metric-card__value\">1021</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">应收账款（元）</p> <p class=\"metric-card__value\">5</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">应付账款（元）</p> <p class=\"metric-card__value\">--</p> </article> <article class=\"metric-card metric-card--wide\"> <p class=\"metric-card__label\">其他应收账款（元）</p> <p class=\"metric-card__value\">--</p> </article> </div> </section> <hr class=\"report-divider\" /> <section class=\"report-subsection report-subsection--tax\" aria-labelledby=\"report-tax-title\"> <div class=\"report-subsection__header\"> <svg class=\"report-accent-bars\" viewBox=\"0 0 44 19\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <path d=\"M7.2082 0L17.62 0L10.4118 19L0 19L7.2082 0ZM20.3732 0L30.785 0L23.5768 19L13.165 19L20.3732 0ZM33.5882 0L44 0L36.7918 19L26.38 19L33.5882 0Z\"></path> </svg> <h3 class=\"report-subsection__title\" id=\"report-tax-title\">纳税状况</h3> </div> <div class=\"metric-grid-type metric-grid-type--two\"> <article class=\"metric-card\"> <p class=\"metric-card__label\">总税额（元）</p> <p class=\"metric-card__value\">82.35</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">年增值税税负率（%）</p> <p class=\"metric-card__value\">--</p> </article> </div> </section> </div> </section> <section class=\"service-report__collaboration report-panel paper-panel-surface\" aria-labelledby=\"report-collaboration-title\"> <header class=\"report-panel__header\"> <div class=\"report-panel__index\" aria-hidden=\"true\"> <p class=\"report-panel__index-text\">2</p> </div> <h2 class=\"section-heading-type\" id=\"report-collaboration-title\">月度沟通协同情况</h2> </header> <div class=\"service-report__collaboration-body\"> <section class=\"report-subsection report-subsection--onsite\" aria-labelledby=\"report-onsite-title\"> <div class=\"report-subsection__header\"> <svg class=\"report-accent-bars\" viewBox=\"0 0 44 19\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <path d=\"M7.2082 0L17.62 0L10.4118 19L0 19L7.2082 0ZM20.3732 0L30.785 0L23.5768 19L13.165 19L20.3732 0ZM33.5882 0L44 0L36.7918 19L26.38 19L33.5882 0Z\"></path> </svg> <h3 class=\"report-subsection__title\" id=\"report-onsite-title\">上门办事</h3> </div> <div class=\"metric-grid-type metric-grid-type--two\"> <article class=\"metric-card\"> <p class=\"metric-card__label\">上门次数</p> <p class=\"metric-card__value\">0</p> </article> <article class=\"metric-card\"> <p class=\"metric-card__label\">VIP线上协同</p> <p class=\"metric-card__value\">已开通</p> </article> </div> </section> </div> </section> <section class=\"service-report__message report-panel paper-panel-surface\" aria-labelledby=\"report-message-title\"> <div class=\"service-report__message-banner\"> <svg class=\"service-report__message-ribbon\" viewBox=\"0 0 296 60\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <defs> <linearGradient id=\"service-report-ribbon-gradient\" x1=\"148\" y1=\"0\" x2=\"148\" y2=\"60\" gradientUnits=\"userSpaceOnUse\"> <stop offset=\"0%\" stop-color=\"#65aeff\"></stop> <stop offset=\"100%\" stop-color=\"#0b7eff\"></stop> </linearGradient> </defs> <path d=\"M0 0H296L285.929 50.353C284.808 55.963 279.883 60 274.162 60H21.838C16.117 60 11.193 55.963 10.071 50.353L0 0Z\" fill=\"url(#service-report-ribbon-gradient)\"></path> </svg> <h2 class=\"service-report__message-title\" id=\"report-message-title\">寄语</h2> </div> <p class=\"service-report__message-copy\">本服务报告由“厦门铸远中嘉税务师事务所有限公司”提供， 我们始终秉持专业立身、服务为本、客户至上的理念， 未来将继续助力企业稳健合规经营，携手同行，再创佳绩。</p> <footer class=\"service-report__message-footer\"> <svg class=\"service-report__quote-mark\" viewBox=\"0 0 140 111\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"> <path d=\"M80 110.75V50.75L106.5 0H133L108.25 48.25H140V110.75H80ZM0 110.75V50.75L26.5 0H53L28.25 48.25H60V110.75H0Z\" fill=\"currentColor\"></path> </svg> <p class=\"service-report__signature\"> 厦门铸远中嘉税务师事务所有限公司 2025-10-24 全体同仁 </p> </footer> </section> </article> </div> </main> </body> </html>"
