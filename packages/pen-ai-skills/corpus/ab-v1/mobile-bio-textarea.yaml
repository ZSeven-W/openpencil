id: mobile-bio-textarea
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a multi-line text input for a user bio field: label
  "About you" above a 5-row textarea input with placeholder text
  "Tell us about yourself — interests, work, hobbies". The input
  area should be tall enough for several lines of text and grow
  vertically. Do NOT include page background, header, other form
  fields, or save button — just the labeled textarea.
expected:
  must_contain_roles:
    - textarea
    - textarea-input
    - label
expected_tool_if_any: add_textarea_v0
