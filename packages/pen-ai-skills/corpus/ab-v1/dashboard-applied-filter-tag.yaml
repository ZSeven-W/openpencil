id: dashboard-applied-filter-tag
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a single applied-filter tag chip that lives in a list-of-
  applied-filters bar above a dashboard data table. The chip is a
  fit_content blue-100 background pill with 12px corner radius and 6px
  gap between its two children:
    1. blue-600 13/500 label "Status: Active"
    2. trailing 14×14 lucide "x" icon (close affordance, blue-600)
  Padding 4px vertical, 10px horizontal. Do NOT render the surrounding
  filter bar, other applied-filter chips, the table itself, or the
  page chrome — just this one closable tag chip.
expected:
  must_contain_roles:
    - tag
    - tag-label
    - tag-remove
expected_tool_if_any: add_tag_v0
