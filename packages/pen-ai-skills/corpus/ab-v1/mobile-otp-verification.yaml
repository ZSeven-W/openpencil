id: mobile-otp-verification
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a 6-digit verification code input: a horizontal row of
  6 empty square slots with rounded corners, first slot showing a
  blue focused border (indicating the cursor is there). Each slot is
  around 48×48px, 12px gap between them. Do NOT include "Enter code"
  label, resend button, submit action, or surrounding page — just
  the 6 blank slots in their awaiting-input state.
expected:
  must_contain_roles:
    - otp-input
    - otp-slot-focused
expected_tool_if_any: add_otp_input_v0
