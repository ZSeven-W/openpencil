id: landing-feature-callout
category: landing
difficulty: obvious
prompt: |
  Design ONLY a single inline doc callout block (NOT a banner alert,
  NOT a hover tooltip). The callout is a fill_container blue-100 tinted
  rectangle with 8px corner radius and 12/16 padding, laid out
  horizontally with a 12px gap. Contents:
    - leading lucide "info" icon (18×18, blue-700)
    - vertical text stack on the right: blue-700 14/600 title "Heads up"
      above blue-700 13/400 1.5-lineheight body "This action affects
      every team member, not just the current project."
  Do NOT render a close × icon (this is a callout, not an alert), the
  surrounding page, or other callouts — just the one info-tone block.
expected:
  must_contain_roles:
    - callout
    - callout-icon
    - callout-title
    - callout-body
expected_tool_if_any: add_callout_v0
