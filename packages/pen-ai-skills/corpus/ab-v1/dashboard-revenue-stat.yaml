id: dashboard-revenue-stat
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a single KPI / stat card tile showing "Monthly
  revenue" of "$12.4k" with the big number rendered large (about
  32px, bold, slate), a small uppercase label "MONTHLY REVENUE"
  above it, and a green "+8% vs last week" delta line underneath
  (this is an upward trend). Include a small trending-up icon in
  the top-right of the header. Do NOT include a chart, sparkline,
  or other tiles — just the one standalone stat card.
expected:
  must_contain_roles:
    - stat-card
    - stat-card-label
    - stat-card-value
    - stat-card-delta
expected_tool_if_any: add_stat_card_v0
