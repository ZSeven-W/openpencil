id: dashboard-dark-empty-chart
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY an empty-state placeholder for a chart widget on a
  DARK-THEME dashboard. The placeholder sits in the same footprint
  the real chart would occupy (about 320×200) and has:
    - a dark slate background (so it matches surrounding dark
      dashboard cards, NOT a light slate-50 rectangle)
    - a dashed border in a slightly lighter dark-slate color
    - a centered line-chart icon in muted gray
    - "No data yet" as a light-colored title beneath the icon
    - a muted hint subtitle underneath explaining that data will
      appear here once tracking begins
  Do NOT render a chart, axes, surrounding dashboard chrome, or
  alternative tiles — just this one dark-theme empty-chart slot.
expected:
  must_contain_roles:
    - empty-chart
    - empty-chart-icon
    - empty-chart-title
    - empty-chart-subtitle
expected_tool_if_any: add_empty_chart_v1
