id: landing-cta-band
category: landing
difficulty: optional
prompt: |
  Design a call-to-action band at the bottom of a landing page (1200
  wide). Dark background, centered heading "Ready to get started?",
  subtext one-sentence, and a single primary CTA button "Create your
  first design".
expected:
  must_contain_roles:
    - heading
    - button
