id: mobile-notification-center
category: mobile
difficulty: optional
prompt: |
  Design a mobile notification center (375×812). Include a top bar
  ("Notifications" + clear-all action), a section header "Today", two
  notification rows (each with an app icon, title, body, and time),
  then a section header "Earlier" with three more notification rows.
expected:
  must_contain_roles:
    - top-nav-bar
    - section-header
