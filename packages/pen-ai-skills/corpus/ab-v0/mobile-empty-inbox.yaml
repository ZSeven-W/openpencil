id: mobile-empty-inbox
category: mobile
difficulty: obvious
prompt: |
  Design ONLY an empty-state block (centered): inbox icon, title
  "No messages yet", subtitle "New conversations will appear here",
  and a primary CTA "Start a conversation". Do NOT include
  surrounding page, navigation, or other content — just this
  empty-state component.
expected:
  must_contain_roles:
    - empty-state
expected_tool_if_any: add_empty_state_v0
