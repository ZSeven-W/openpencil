id: dashboard-wizard-stepper
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a horizontal numbered stepper (1)─(2)─(3)─(4)─(5)
  showing 5 steps where steps 1 and 2 are completed (filled
  circles), step 3 is current, and steps 4-5 are pending.
  Connectors between steps fill the space evenly. No surrounding
  wizard content, no header — just the stepper.
expected:
  must_contain_roles:
    - stepper
  min_roles:
    step-connector: 2
    step-connector-active: 1
expected_tool_if_any: add_stepper_v0
