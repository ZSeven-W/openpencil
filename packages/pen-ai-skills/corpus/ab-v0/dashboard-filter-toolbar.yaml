id: dashboard-filter-toolbar
category: dashboard
difficulty: optional
prompt: |
  Design a dashboard filter toolbar (1200 wide) with a search bar on
  the left, a row of toggle chips in the middle ("Active", "Archived",
  "Flagged"), and on the right a segmented control switching between
  "Day / Week / Month" views.
expected:
  must_contain_roles:
    - search-bar
