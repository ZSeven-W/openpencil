id: mobile-tabs-demo
category: mobile
difficulty: optional
prompt: |
  Design a mobile screen (375×812) with a top nav bar titled "Explore",
  a horizontal tab row with three underline tabs ("For you" active,
  "Trending", "Latest"), and a placeholder content area under the
  active tab.
expected:
  must_contain_roles:
    - top-nav-bar
    - tabs
