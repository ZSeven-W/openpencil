id: landing-pricing-section
category: landing
difficulty: obvious
prompt: |
  Design ONLY a price typography block for a SaaS "Pro" plan:
  currency glyph "$", big amount "29", trailing period "/month".
  The three parts render inline with tight baseline alignment. Do
  NOT include a surrounding pricing card, plan name, feature list,
  CTA button, or any other content — just the price typography.
expected:
  must_contain_roles:
    - price
    - price-currency
    - price-amount
    - price-period
expected_tool_if_any: add_price_v0
