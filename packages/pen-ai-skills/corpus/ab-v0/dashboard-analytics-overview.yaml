id: dashboard-analytics-overview
category: dashboard
difficulty: optional
prompt: |
  Design an analytics overview page (1200 wide) with a section titled
  "This week" containing three cards side by side: Total visits, Avg
  session time, Bounce rate. Each card has a title, a big number, a
  small trend delta, and a tiny sparkline placeholder. Below, a
  "View full report" text link.
expected:
  must_contain_roles:
    - heading
