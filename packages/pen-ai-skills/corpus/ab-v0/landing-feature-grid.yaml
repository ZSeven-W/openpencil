id: landing-feature-grid
category: landing
difficulty: optional
prompt: |
  Design a feature grid section on a landing page (1200 wide) with
  six feature cards in a 3-column × 2-row grid. Each card has an
  icon, a short title, and a one-sentence description. Above the
  grid, a section heading "Everything you need" and a one-sentence
  subtitle.
expected:
  must_contain_roles:
    - heading
