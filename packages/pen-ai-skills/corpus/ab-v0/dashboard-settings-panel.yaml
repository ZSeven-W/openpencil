id: dashboard-settings-panel
category: dashboard
difficulty: optional
prompt: |
  Design a grouped settings panel (1200 wide). Three grouped
  sections, each introduced by a heading: "Account" (fields Email,
  Password), "Notifications" (two toggle switches: Email digest,
  Push), and "Danger zone" (a destructive "Delete account" button).
  Dividers between groups.
expected:
  must_contain_roles:
    - heading
