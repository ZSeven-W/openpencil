id: dashboard-kpi-strip
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a non-scrolling inline stats strip with 4 cells side
  by side, sharing the row width equally: Revenue ($128K, icon
  "trending-up"), New Users (2,340, icon "user-plus"), Active
  Sessions (18,902, icon "activity"), Churn (1.2%, icon
  "trending-down"). Each cell has an icon, big value, small label.
  Do NOT include page background, header, or any other content —
  just the stats strip.
expected:
  must_contain_roles:
    - stat-grid
  min_roles:
    stat-cell: 4
expected_tool_if_any: add_stat_grid_v0
