id: landing-hero
category: landing
difficulty: optional
prompt: |
  Design a hero section for a SaaS landing page (1200 wide). Include
  a large headline ("Ship your designs faster"), a supporting
  one-sentence body, two CTAs side by side ("Start free trial"
  primary, "Watch demo" secondary), and a product-screenshot
  placeholder on the right.
expected:
  must_contain_roles:
    - heading
    - button
