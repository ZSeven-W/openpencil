id: mobile-social-login
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a social auth row on a login screen: three stacked
  full-width buttons for "Continue with Google", "Continue with
  Apple", and "Continue with Microsoft". Each button is 48px tall,
  rounded corners, white fill with a subtle border, a small provider
  icon on the left, and the "Continue with …" label. Do NOT include
  an email field, OR divider, or other login content — just the
  social-auth button row.
expected:
  must_contain_roles:
    - social-login-row
    - social-login-button
    - social-login-button-label
  min_roles:
    social-login-button: 3
expected_tool_if_any: add_social_login_row_v0
