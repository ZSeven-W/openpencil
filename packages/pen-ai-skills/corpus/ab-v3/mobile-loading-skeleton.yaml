id: mobile-loading-skeleton
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a loading skeleton placeholder that mimics future
  text content: 4 stacked gray rectangular lines (rounded corners,
  light gray #E2E8F0), each about 16px tall with 12px gap between
  them. The last line should be shorter (about 60% width) to look
  like an unfinished paragraph. Do NOT include page background,
  header, or any other content — just the skeleton placeholder.
expected:
  must_contain_roles:
    - skeleton
    - skeleton-row
  min_roles:
    skeleton-row: 4
expected_tool_if_any: add_skeleton_v0
