id: dashboard-customers-table
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a single body row of a desktop dashboard customers
  data-table — no surrounding card chrome, no other rows, no header.
  The row spans the full container width, is 48px tall with 16px
  horizontal padding and 16px gap between cells, no fill (a separate
  divider component handles row separators), and contains four
  evenly-spaced cells of slate-900 14/400 text:
    1. "Sarah Lee"
    2. "sarah@acme.com"
    3. "Active"
    4. "$1,240"
  Do NOT render the column-header row, vertical column dividers, the
  surrounding table card, the page chrome, or any leading/trailing
  affordance — just one body row of cells.
expected:
  must_contain_roles:
    - data-table-row
    - data-table-cell
    - data-table-cell-text
expected_tool_if_any: add_data_table_row_v0
