id: dashboard-revenue-line
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a line chart showing daily revenue for the past
  week: 7 data points (120, 145, 138, 162, 155, 178, 192), 160px
  tall, with a blue stroke line connecting the points and a
  filled dot at each data point vertex. Do NOT include axes,
  labels, title, or surrounding dashboard chrome — just the
  line chart itself.
expected:
  must_contain_roles:
    - chart-line
    - chart-line-path
  min_roles:
    chart-line-dot: 7
expected_tool_if_any: add_chart_line_v0
