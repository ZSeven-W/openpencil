id: landing-share-row
category: landing
difficulty: obvious
prompt: |
  Design ONLY a "share to" button row that lives below a finished blog
  post — a horizontal row of four share targets, 16px gap. Each target
  is a vertical stack:
    - 40×40 circular slate-100 icon button with the lucide icon
      centered (18×18, slate-600)
    - small slate-600 11/500 label below the icon, 6px gap
  Targets in order: Twitter (icon "twitter") / Facebook (icon
  "facebook") / Email (icon "mail") / Copy link (icon "link").
  Do NOT render the post content, surrounding card, or social-login
  CTAs — just the share row.
expected:
  must_contain_roles:
    - share-row
    - share-target
    - share-target-icon
    - share-target-label
expected_tool_if_any: add_share_row_v0
