id: dashboard-category-filter-group
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a single sidebar filter group titled "Category" for an
  e-commerce search page. It's the kind of facet you click on to
  narrow results. The block contains:
    - a heading row with the title "Category" (14/600, dark)
    - a vertical list of 5 checkbox options, each row ~32px tall:
        - "Apparel" (count 124)  — selected
        - "Footwear" (count 86)
        - "Bags" (count 41)
        - "Accessories" (count 67)
        - "Outerwear" (count 23)
      Each option row shows a small square checkbox at the leading
      edge, the label, and a muted right-aligned count. The
      "Apparel" row's checkbox is filled (selected).
  Do NOT render the search results panel, the sidebar's other
  facets, breadcrumbs, or product cards — only this one filter
  group.
expected:
  must_contain_roles:
    - filter-group
    - filter-group-title
    - filter-group-option
    - filter-group-checkbox
    - filter-group-check
    - filter-group-label
    - filter-group-count
expected_tool_if_any: add_filter_group_v0
