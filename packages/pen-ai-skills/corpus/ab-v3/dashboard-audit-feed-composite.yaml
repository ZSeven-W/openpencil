id: dashboard-audit-feed-composite
category: dashboard
difficulty: composite
prompt: |
  Design the body of a "Recent activity" admin panel — an audit
  feed for a workspace. The panel is 720px wide. Contents
  top-to-bottom:
    - a section header "Recent activity" (16/600) with a muted
      "Last 24 hours" subline
    - 6 activity-log entries, stacked vertically with 12px gap. Each
      entry is one line tall (~32px) containing a tinted icon dot
      on the left, an inline "<actor> <action>" body (actor bold),
      and a right-aligned relative timestamp. Use these:
        - check-mark icon, "Sarah Lee" "approved the production
          deploy", "2h ago"
        - upload icon, "Marcus Chen" "uploaded final-mockups.zip",
          "3h ago"
        - user-plus icon, "Aiko Tanaka" "invited
          jordan@acme.com to the workspace", "5h ago"
        - alert-triangle icon (warning tone), "System"
          "rate-limited an IP after 50 failed sign-ins", "8h ago"
        - settings icon, "Raj Patel" "updated billing details", "yesterday"
        - trash icon (danger tone), "Sarah Lee" "deleted
          archive-2024.zip", "yesterday"
  Do NOT render filters, a date picker, navigation, or a sidebar —
  only the section header + the 6 audit entries.
expected:
  must_contain_roles:
    - section-header
    - activity-log
    - activity-log-icon-dot
    - activity-log-line
    - activity-log-timestamp
  min_roles:
    activity-log: 6
