id: mobile-country-select
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a dropdown select field in its closed / display
  state: label "Country" above a 48px-tall input box containing
  the selected value text "United States" on the left and a
  chevron-down icon on the right edge (indicating a dropdown).
  Do NOT include page background, header, other form fields, or
  the open menu / option list — just the closed select.
expected:
  must_contain_roles:
    - select
    - select-input
    - label
expected_tool_if_any: add_select_v0
