id: mobile-single-comment
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a single comment row: circular avatar with initial
  "J" on the left, then author name "James" (bold) inline with
  timestamp "2h ago" (small, gray), with the comment body text
  below on a new line: "Really enjoyed this article — thanks for
  writing it up!". Do NOT include reply input, like button, action
  menu, or any surrounding list / page chrome — just the single
  comment row.
expected:
  must_contain_roles:
    - comment
    - comment-avatar
    - comment-author
    - comment-timestamp
    - comment-body
expected_tool_if_any: add_comment_v0
