id: dashboard-chart-legend-item
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY a single chart-legend entry that explains one series in a
  revenue-trend dashboard. Horizontal layout, fit_content sizing,
  centered alignment, 8px gap between three children:
    1. 10×10 rounded-2 colored marker filled #2563EB (blue-600)
    2. slate-600 13/400 series label "Revenue"
    3. bold slate-900 13/600 value "$12,480" right-aligned
  Do NOT render the chart, other legend entries, or surrounding card
  chrome — just the one legend item row.
expected:
  must_contain_roles:
    - legend-item
    - legend-item-marker
    - legend-item-label
    - legend-item-value
expected_tool_if_any: add_legend_item_v0
