id: landing-cookie-banner
category: landing
difficulty: obvious
prompt: |
  Design ONLY a cookie consent banner that would sit sticky at the
  bottom of a webpage. The banner is a rounded white card with a
  thin slate border and a soft drop shadow. Contents from top to
  bottom:
    - bold headline "We use cookies"
    - one-paragraph disclosure body in muted slate explaining that
      cookies are used to enhance the experience, analyze traffic,
      and personalize content
    - a row containing two buttons side-by-side: a slate "Reject"
      button on the left and an accent-blue "Accept all" button on
      the right (decline-then-accept order so the primary action
      is on the right)
    - a small accent-blue text link "Cookie settings" beneath the
      buttons for fine-grained consent
  Do NOT render surrounding page content, sticky positioning chrome,
  or other modal layers — just the banner card itself.
expected:
  must_contain_roles:
    - cookie-banner
    - cookie-banner-title
    - cookie-banner-body
    - cookie-banner-actions
    - cookie-banner-decline
    - cookie-banner-accept
    - cookie-banner-settings
expected_tool_if_any: add_cookie_banner_v0
