id: dashboard-edit-drawer
category: dashboard
difficulty: obvious
prompt: |
  Design ONLY the SHELL of a right-side slide-in drawer (full height,
  400px wide, white background, soft drop shadow on the left). At the
  top of the drawer is a 56px header row with 20px horizontal padding:
    - bold slate-900 16/600 title "Edit project" on the left
    - 32px square close button on the right with a lucide "x" icon (18×18,
      slate-600)
  A 1px slate-200 bottom border separates the header from the body.
  Do NOT render the body content, the dimmed scrim behind the drawer,
  the page underneath, or other drawers — just the drawer shell with
  its header row.
expected:
  must_contain_roles:
    - drawer-shell-right
    - drawer-shell-header
    - drawer-shell-title
    - drawer-shell-close
expected_tool_if_any: add_drawer_shell_v0
