id: mobile-upload-dropzone
category: mobile
difficulty: obvious
prompt: |
  Design ONLY a file upload drop area: a dashed-border rectangular
  tile with a cloud-upload icon centered at top, "Drop files to
  upload" as the main label, and "or click to browse" as a muted
  secondary line. Light slate background. Roughly 480px wide, 200px
  tall. Do NOT include page background, header, form fields, or
  upload progress — just the empty drop zone.
expected:
  must_contain_roles:
    - upload-dropzone
    - upload-dropzone-icon
    - upload-dropzone-title
    - upload-dropzone-subtitle
expected_tool_if_any: add_upload_dropzone_v0
