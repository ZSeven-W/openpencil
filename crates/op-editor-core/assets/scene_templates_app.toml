# Scene template catalogue — app screens and 4:3 decks.
#
# The catalogue parser concatenates scene_templates_prefix.toml,
# scene_templates.toml and this file, so each checked-in source stays below
# the repository's 800-line limit. Same schema as the other two files.
#
# The five `app` entries carry the style guide their palette and type embody,
# but the `app` scene offers no "generate from this" action, so the guide is
# provenance only. The two 4:3 decks carry none on purpose: the slides
# generate path builds 1920×1080 boards, and a 4:3 card offering it would hand
# back a 16:9 deck.

[[template]]
id = "coffee-order-app"
scene = "app"
title_key = "sceneTemplate.item.coffeeOrderApp.title"
title_fallback = "咖啡点单 App"
summary_key = "sceneTemplate.item.coffeeOrderApp.summary"
summary_fallback = "暖象牙底的三屏点单流程：主推新品大图与分类、左栏分类加购物车条的菜单、取餐码与制作进度的订单页，适合餐饮与零售小程序。"
tags = ["App", "手机", "咖啡", "点单", "菜单", "订单", "餐饮", "app", "mobile", "coffee", "order"]
frames = 3
frame_width = 375
frame_height = 812
style_guide = "warm-food-mobile-light"

