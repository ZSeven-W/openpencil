# Scene template catalogue — the Studio Home example templates.
#
# The catalogue parser concatenates scene_templates_prefix.toml,
# scene_templates.toml, scene_templates_app.toml and this file, so each
# checked-in source stays below the repository's 800-line limit. Same schema.
#
# Each entry here is the instant draft of one Home task's example brief
# (`home_example_draft.rs::example_draft_template`): its content, page count,
# sections and palette are that example's own, so the example card's title,
# description and pages line describe exactly what the click delivers.
# `city-music-fest-poster` has two boards (3:4 poster + 1:1 square); the
# size fields carry the lead board, like every multi-board entry.

