[package]
name = "op-host-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil headless host services — the GUI-free backend (serve-web daemon, MCP, AI chat/orchestration, export, persistence) shared by op-host-desktop + op-host-web-server; no winit/skia-GL"

[lib]
name = "op_host_services"
path = "src/lib.rs"

[features]
default = []
# Mirrors op-host-desktop's debug-tools toggle for the MCP server.
mcp-debug-tools = ["op-mcp/debug-tools"]
# Production release lane; forwarded by op-host-web-server.
pinned-skia-binaries = ["skia-safe/no-compile"]
# Dev-only collaboration tickets for the serve-web daemon, mirroring
# op-host-desktop's flag of the same name: links the locally built ABI-v2
# op-auth archive (debug profile only; see op-auth-bridge/README).
dev-op-auth-abi-v2 = [
  "op-auth-bridge/dev-abi-v2",
  "op-collab-host/dev-op-auth-abi-v2",
]

[dependencies]
# --- workspace path deps (the headless daemon's closure; modules land in
#     Phases 2-5). Conditional deps (op-codegen / op-config-store) are added
#     when a moved module proves it needs them, per the plan. op-figma landed
#     for the VS Code plugin's offline `.fig` -> `.op` convert endpoint
#     (figma_convert.rs). ---
op-figma = { path = "../op-figma" }
op-html = { path = "../op-html" }
op-editor-core = { path = "../op-editor-core" }
op-builtin-model-discovery = { path = "../op-builtin-model-discovery" }
# Device-login proxy for the web editor (prebuilt library or inert stub).
op-auth-bridge = { path = "../op-auth-bridge" }
op-config-store = { path = "../op-config-store" }
op-editor-ui = { path = "../op-editor-ui" }
op-editor-host-core = { path = "../op-editor-host-core" }
op-mcp = { path = "../op-mcp", features = ["script"] }
op-ai = { path = "../op-ai" }
op-ai-skills = { path = "../op-ai-skills" }
op-orchestrator = { path = "../op-orchestrator" }
op-design-lint = { path = "../op-design-lint" }
op-pen-loader = { path = "../op-pen-loader" }
op-render-export = { path = "../op-render-export" }
# Shared image-slot detection + result write-back for the MCP
# `enrich_images` tool (also used by op-host-desktop's search session).
op-image-enrich = { path = "../op-image-enrich" }
op-process-io = { path = "../op-process-io" }
op-acp = { path = "../op-acp" }
op-i18n = { path = "../op-i18n" }
# Canonical JSON/HTML string escaping (dependency-free).
op-util = { path = "../op-util" }
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
agent = { path = "../../vendor/agent/crates/agent", default-features = false }
anthropic-agent-sdk = { path = "../../vendor/anthropic-agent-sdk" }
# Collaboration runtime — the daemon runs the same owner/guest actors the
# desktop GUI runs, so a browser client gets real sessions instead of a
# permanently `Unavailable` panel.
op-collab-host = { path = "../op-collab-host" }

# --- external (crates.io / forks) ---
github-copilot-sdk = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "io-util",
  "process",
  "net",
  "time",
] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"

zip = "2"
memmap2 = "0.9"
dirs = "5"
# Raster + PDF Skia shared with `op-render-export`, plus chat image processing
# in this crate — NO `gl` (the headless server links no GL). Cargo keeps this
# gl-free in the isolated `-p op-host-services` build.
skia-safe = { version = "0.97.0", default-features = false, features = [
  "binary-cache",
  "textlayout",
  "pdf",
] }

# Unix signal handling for the online daemon's controlled shutdown. Already in
# the dependency graph transitively; named here so the SIGTERM handler can use
# it directly. Unix-only — the online daemon is a container deployment.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Controlled collaboration fixtures so the collab_state tests can drive the
# real begin -> install -> reject/fail path instead of asserting on a
# hand-built outcome value. Dev-only: the normal dependency above (line 53)
# stays feature-free, so nothing ships with `test-support` compiled in.
op-collab-host = { path = "../op-collab-host", features = ["test-support"] }
