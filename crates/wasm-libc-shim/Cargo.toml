[package]
name = "wasm-libc-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C-hard.2 — minimal libc / libcxx / libm shim for wasm32-unknown-unknown skia bundles (Step 1b §3.2 P0.5B Run path)"

[lib]
name = "wasm_libc_shim"
path = "src/lib.rs"

[dependencies]
# Pure-Rust no_std allocator with a wasm32 backend; satisfies the
# malloc/free/calloc/realloc/malloc_usable_size import family.
dlmalloc = { version = "0.2", features = ["global"] }

# Pure-Rust no_std math; satisfies asinh/acosh/atanh/nextafterf/remainder.
libm = "0.2"

[build-dependencies]
# Compile a tiny C stub for the variadic snprintf / vsnprintf / vfprintf
# trio. Stable Rust does not allow `extern "C" fn(...)` with C-variadic
# without the `c_variadic` feature; using a 5-line .c file keeps the
# crate stable-compatible.
cc = "1"

[features]
default = []
