[package]
name       = "op-engine-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish    = false
description = "Android JNI marshalling layer for the OpenPencil engine player (op-engine-ffi)"

[lib]
# cdylib for the Android Player; rlib so the host-triple queue tests link.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# EGL/GLES rendering on Android (jian-skia surface/egl_android).
gl = ["op-engine-ffi/gl"]
# Metal rendering on iOS — forwards to the engine so the cross-target
# compile guard can pass the same platform feature on every mobile target.
metal = ["op-engine-ffi/metal"]
# Full-editor mode (forwards to the engine's editor feature).
editor = ["op-engine-ffi/editor"]
# Local-only authentication for Android editor builds. The underlying bridge
# rejects unsigned archives outside Cargo's debug profile.
mobile-auth-dev = ["op-engine-ffi/mobile-auth-dev"]

[dependencies]
op-engine-ffi = { path = "../op-engine-ffi" }

[target.'cfg(target_os = "android")'.dependencies]
jni     = "0.21"
ndk-sys = "0.6"
zeroize = "1"
