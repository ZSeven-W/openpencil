[package]
name = "op-render-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Mobile-safe OpenPencil raster, SVG, and PDF export core"

[lib]
name = "op_render_export"
path = "src/lib.rs"

[features]
default = []
pinned-skia-binaries = ["skia-safe/no-compile"]

[dependencies]
op-editor-core = { path = "../op-editor-core" }
op-editor-ui = { path = "../op-editor-ui" }
op-motion-export = { path = "../op-motion-export" }
op-host-native = { path = "../op-host-native", default-features = false }
op-pen-loader = { path = "../op-pen-loader" }
jian-core = { path = "../../vendor/jian/crates/jian-core" }
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
jian-scene = { path = "../../vendor/jian/crates/jian-scene" }
gif = "0.14"
png = "0.18"
zip = { version = "9", default-features = false }
glam = { version = "0.29", default-features = false, features = ["std"] }
skia-safe = { version = "0.97.0", default-features = false, features = [
  "binary-cache",
  "textlayout",
  "pdf",
] }

[dev-dependencies]
base64 = "0.22"
op-preview-core = { path = "../op-preview-core" }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dev-dependencies]
mp4 = "0.14.0"
rusty_h264-common = { version = "0.17.2", default-features = false, features = ["std"] }
rusty_h264-decoder = { version = "0.17.2", default-features = false, features = ["std"] }
