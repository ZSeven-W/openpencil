[package]
name = "op-collab-relay-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded TCP-to-WebSocket relay bridge for OpenPencil collaboration"

[dependencies]
op-collab-relay-protocol = { path = "../op-collab-relay-protocol" }
futures-util = "0.3"
thiserror = { workspace = true }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  # iOS/Android have no /etc/ssl/certs for rustls-native-certs' generic unix
  # probe, leaving the root store empty and failing every wss:// relay
  # connect; the bundled webpki roots make relay TLS work on every target.
  "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
] }
