[package]
name = "op-opmerge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Node-level three-way merge for OpenPencil .op documents"

# Pure, platform-free: a structured 3-way merge over the `.op`
# document JSON, keyed by node `id`. Used by the in-app Git merge
# orchestrator so a conflicting `.op` merge resolves per PenNode
# instead of as opaque text. No git / IO dependency — it takes the
# three document texts and returns the merged tree + node conflicts.
[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }
