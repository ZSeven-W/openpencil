[package]
name = "op-collab-relay-locator-hsm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
description = "PKCS#11-backed OPLS signer for OpenPencil relay locators"
publish = false

# Every dependency is Unix-gated because the crate itself is: on other platforms
# the library compiles to nothing and the binary is a stub that exits with an
# unsupported-platform error. Keeping the dependencies out of the non-Unix graph
# means a Windows `cargo build --workspace` neither resolves nor builds the
# PKCS#11 and crypto stack for code that cannot run there.
[target.'cfg(unix)'.dependencies]
base64 = "0.22"
cryptoki = "0.12.1"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
libc = "0.2"
op-collab-relay-protocol = { path = "../op-collab-relay-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dev-dependencies]
tempfile = "3"
