[package]
name = "op-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil ACP client — Agent Client Protocol (ndJSON JSON-RPC) transport, ported from the TS pen-acp package"

[features]
default = ["remote"]
# Remote ACP agents over a WebSocket endpoint. Local (stdio) agents
# work without this feature; `remote` adds the `tokio-tungstenite`
# dependency for the WebSocket transport.
remote = [
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]

[dependencies]
# Desktop-only crate: spawns child processes + drives async IO, so it
# pulls tokio. Never depended on by a wasm crate.
tokio = { version = "1", features = [
  "process",
  "io-util",
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
op-rpc-transport = { path = "../op-rpc-transport" }
# Chat-delta vocabulary the ACP event adapter maps onto.
op-ai = { path = "../op-ai" }
# Bounded + redacted child-output tails, shared with the CLI bridge.
op-util = { path = "../op-util" }
# Official ACP 2.0 SDK. We intentionally use its stable v1 schema only;
# the draft `unstable_protocol_v2` feature stays disabled.
agent-client-protocol = "=2.0.0"
# Shared process-tree termination for local stdio agents.
op-process-io = { path = "../op-process-io" }

tokio-tungstenite = { version = "0.24", optional = true, default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }
