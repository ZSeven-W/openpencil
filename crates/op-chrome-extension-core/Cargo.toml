# Logic core of the OpenPencil Chrome extension (`packages/op-chrome-extension`).
#
# Everything here is pure, host-agnostic logic: it never touches `chrome.*`,
# the DOM, or the network. The extension's JS is reduced to a glue layer that
# calls `chrome.*`, executes `fetch`, and paints the popup; every rule that can
# be decided without a browser API lives in this crate and is unit-tested
# natively (`cargo test -p op-chrome-extension-core`).
#
# MUST stay wasm32-clean: the shipped artifact is a
# `wasm32-unknown-unknown` cdylib loaded by the popup.
[package]
name = "op-chrome-extension-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil Chrome extension logic core — endpoint rules, chunked-transfer integrity, ingress envelopes and reply classification (wasm)"

[lib]
name = "op_chrome_extension_core"
path = "src/lib.rs"
# `cdylib` for the wasm artifact, `rlib` so the native test build links.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Canonical JSON string escaping, shared with op-mcp's hand-rolled JSON-RPC
# serializer. Dependency-free leaf crate, wasm32-clean by contract.
op-util = { path = "../op-util" }
# The snapshot → `.op` (PenDocument) conversion, shared with the `op` CLI's
# `import:snapshot` command. wasm32-clean by contract (op-host-web depends on
# it and builds to wasm32), so the offline download can produce a ready-to-open
# `.op` document in the browser instead of the raw snapshot JSON.
op-html = { path = "../op-html" }
# The canonical `.op` document schema `import_snapshot_document` returns; needed
# to walk the imported node tree for the reported node count.
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
# Used ONLY to parse the (small) HTTP reply bodies the ingresses answer
# with. The outbound `tools/call` envelope is built with `format!` +
# `op_util::json_escape`, mirroring `op-mcp`'s serializer, so the multi-MB
# snapshot string is escaped in one streaming pass instead of being routed
# through an intermediate `serde_json::Value`.
serde = { workspace = true }
serde_json = { workspace = true }
# Pin matches op-host-web / op-web-sdk — the wasm-bindgen crate and the
# installed `wasm-bindgen-cli` must agree exactly.
wasm-bindgen = "=0.2.117"
