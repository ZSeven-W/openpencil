[package]
name = "openpencil-shell-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil shell — platform-agnostic widget facade + RenderBackend trait, Jian re-export wrapper (spec v19 §1.2 / §5.2)"

[lib]
name = "openpencil_shell_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# v19 pivot: glam Vec2 used as Point2D; bitflags used for widget facade internal flags.
glam = { version = "0.29", default-features = false, features = ["std"] }
bitflags = "2"
# Step 1b §3.6 widget facade: every Widget exposes an `accesskit::Node`
# representation so the host (native + shell-web DOM mirror) can build a
# unified accessibility tree. Pinned to 0.24 to match shell-web (the
# version compatible with the upstream accesskit_winit Step 1a uses on
# shell-native).
accesskit = "0.24"

# v19 pivot: re-export Jian render/geometry/scene types (spec §5.2 widget-facing facade
# wraps jian-core; native-only deps live in shell-native, jian-core itself is wasm32-clean).
# Both path + version per spec §12.2 ("path dep with explicit version") — guards against
# cargo silently picking a wrong version under a different workspace context.
jian-core = { path = "../../vendor/jian/crates/jian-core", version = "0.0.1" }

# Phase 3 strangler reorg: i18n (Locale + 15-locale string tables) extracted
# into op-i18n; shell-core re-exports it as `i18n` so downstream callers keep
# resolving `crate::i18n::*` / `crate::document::Locale` unchanged.
op-i18n = { path = "../op-i18n" }

[features]
default = []
serde = ["dep:serde"]
