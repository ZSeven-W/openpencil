[package]
name = "openpencil-shell-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil shell — re-export shim over op-editor-ui / op-editor-core / op-i18n (Phase 7 strangler reorg; dissolved in Task 7.3)"

[lib]
name = "openpencil_shell_core"
path = "src/lib.rs"

[dependencies]
# v19 pivot: re-export Jian render/geometry/scene types (spec §5.2). The
# `jian` module wraps jian-core; the crate root also re-exports
# `jian_core::gesture` event types.
jian-core = { path = "../../vendor/jian/crates/jian-core", version = "0.0.1" }

# Phase 3 strangler reorg: i18n extracted into op-i18n; re-exported as `i18n`.
op-i18n = { path = "../op-i18n" }

# Phase 4 strangler reorg: the wasm-clean RenderBackend trait + facade
# types live in op-editor-core; re-exported as `render_backend`.
op-editor-core = { path = "../op-editor-core" }

# Phase 7 strangler reorg: the widget facade + theme + layout scene +
# scene-var aggregation live in op-editor-ui; re-exported so the hosts
# keep resolving `openpencil_shell_core::widgets` / `::theme` / etc.
op-editor-ui = { path = "../op-editor-ui" }
