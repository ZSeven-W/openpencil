[package]
name = "op-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil MCP server — JSON-RPC tool registry over op-editor-core EditorState / EditorCommand"

[lib]
name = "op_mcp"
path = "src/lib.rs"

[features]
default = []
debug-tools = []
# Native-only QuickJS script→program expansion for batch_design + the
# orchestrator. Never enabled by wasm consumers (bundled C engine).
script = ["dep:rquickjs", "dep:tracing"]

[dependencies]
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema" }
jian-scene = { path = "../../vendor/jian/crates/jian-scene" }
op-ai-skills = { path = "../op-ai-skills" }
op-design-lint = { path = "../op-design-lint" }
op-editor-core = { path = "../op-editor-core" }
op-pen-loader = { path = "../op-pen-loader" }
regex = "1"
rquickjs = { version = "0.12", optional = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
