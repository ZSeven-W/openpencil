[package]
name = "op-host-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenPencil web host — wasm32-unknown-unknown web bundle entry (Step 1b §1.2, C-hard pipeline)"

[lib]
name = "op_host_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Phase 7.3 reorg: openpencil-shell-core dissolved — widget facade /
# theme / layout scene / scene vars / render-backend / gesture types
# all resolve through the op-editor-ui crate.
op-editor-ui = { path = "../op-editor-ui" }
# Reorg: the web host owns an `op_editor_core::EditorState` as its
# single source of truth; `op-pen-loader` bridges it into the
# read-only paint `Document` the shared widgets consume.
#
# Both are `optional` + behind the `skia` feature for the SAME reason
# `skia-safe` is: the host (`widget_host`) is `#[cfg(feature="skia")]`-
# gated, so the skia-free CI stub baseline
# (`--no-default-features --features web`) never needs them. This
# matters because `op-pen-loader` pulls `jian-skia` transitively
# (`pen_document_to_document` runs `SkiaMeasure` for text layout);
# keeping it optional preserves the wasm32-clean stub baseline.
op-editor-core = { path = "../op-editor-core", optional = true }
op-editor-host-core = { path = "../op-editor-host-core", optional = true, default-features = false }
# default-features = false drops `skia-measure`; the `skia` feature re-enables
# it so only the CanvasKit build stays skia-free (estimate text measurement).
op-pen-loader = { path = "../op-pen-loader", optional = true, default-features = false }
# P4b web AI-streaming foundation: the codegen/AI pipeline. Optional + behind
# the `codegen` feature (which also pulls `skia`) so the wasm32-clean stub
# baseline (`--no-default-features --features web`) never compiles it. NOTE:
# the new web modules it backs (web_ai_transport / raf_pump / web_clipboard)
# are UNVERIFIED — they could not be compile-checked on wasm32 without EMSDK.
op-codegen = { path = "../op-codegen", features = ["ai"], optional = true }
# P5 web codegen session: `build_codegen_input` resolves the selection into
# `PenNode` subtrees (jian-ops-schema), serializes them (serde_json), and
# constructs the pipeline `CodegenInput` whose param enums come from op-ai.
# All optional + behind `codegen` so the wasm32-clean stub baseline never
# pulls them. NOTE: UNVERIFIED on wasm32 (needs EMSDK).
op-ai = { path = "../op-ai", optional = true }
jian-ops-schema = { path = "../../vendor/jian/crates/jian-ops-schema", optional = true }
serde_json = { workspace = true, optional = true }
# Browser file-IO P0: Figma `.fig` parsing + clipboard-HTML decoding for the
# web shell. Pure-Rust (flate2/miniz_oxide + ruzstd + base64 — wasm32-clean,
# no C toolchain), so the same crate the desktop host uses compiles for the
# browser bundle. Optional + behind `codegen` with the rest of the document
# pipeline deps so the wasm32-clean stub baseline never pulls it.
op-figma = { path = "../op-figma", optional = true }
# Step 1b §3.6: handwritten DOM mirror consumes accesskit::TreeUpdate (0.24).
accesskit = "0.24"
console_error_panic_hook = "0.1"
js-sys = "0.3"
base64 = "0.22"
# CanvasKit FFI: await the async CanvasKitInit() promise from Rust.
wasm-bindgen-futures = { version = "0.4", optional = true }
# Phase C1 DOM event mappers build `jian_core::gesture::WheelEvent` etc
# whose position/delta fields use `jian_core::geometry::Point`. The
# `geometry` module is not re-exported by shell-core (which only
# re-exports `gesture::*`), so pull jian-core directly. Same path-with-
# version pattern as shell-core's own jian-core dep.
jian-core = { path = "../../vendor/jian/crates/jian-core", version = "0.0.1" }
# Pin to 0.2.117 — last wasm-bindgen-cli release compatible with the
# workspace's Rust 1.85 toolchain. Newer 0.2.120+ requires rustc 1.86.
# When the workspace bumps Rust, raise this bound.
wasm-bindgen = "=0.2.117"

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "Clipboard",
  # Browser file-IO P0 (paste / drag-drop / hidden file input): the
  # ClipboardEvent / DataTransfer / DragEvent / File* / HtmlInputElement
  # bindings below are only *called* from the `codegen`-gated dom_io glue,
  # but web-sys feature flags are compile-time binding toggles — they keep
  # the `web` stub baseline compiling unchanged.
  "ClipboardEvent",
  "CompositionEvent",
  "console",
  "DataTransfer",
  "Document",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileReader",
  "FocusEvent",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "ImageData",
  "KeyboardEvent",
  # `daemon_base` derives the daemon origin from `window.location`.
  "Location",
  "MouseEvent",
  "Navigator",
  "Performance",
  "PointerEvent",
  "ProgressEvent",
  "TextMetrics",
  "Url",
  "WheelEvent",
  "Window",
  # Used only by the (opt-in) `live-sync` glue to poll the web-canvas daemon.
  "XmlHttpRequest",
  "XmlHttpRequestEventTarget",
]

[features]
# `web` keeps the kickoff §1.2 wasm32-unknown-unknown CI baseline green —
# the crate compile-checks as a wasm32-clean stub without pulling skia.
default = ["web"]
web = []
# `canvaskit` renders the Rust web shell through the official CanvasKit skia
# WASM artifact (no embedded skia-safe, no libc/GL shim). The backend calls
# CanvasKit via the `op_ck_bridge.js` FFI; all widget/draw logic stays in Rust.
canvaskit = [
  "dep:wasm-bindgen-futures",
  "dep:op-editor-core",
  "dep:op-pen-loader",
  "dep:jian-ops-schema",
  # Web integration modules absorbed from the codegen/skia path: AI chat
  # streaming (web_chat/web_ai_transport), live-sync, codegen, Figma/file IO.
  # All are pure web_sys/serde logic — no skia-safe.
  "dep:serde_json",
  "dep:op-figma",
  # Codegen pipeline (codegen_web/codegen_bundle) — pure AI/code-generation
  # logic crates, no skia.
  "dep:op-codegen",
  "dep:op-ai",
  "dep:op-editor-host-core",
  "op-editor-host-core/chat",
  "op-editor-host-core/codegen",
]
# (Retired 2026-06-17: the skia raster WebBackend (`skia`) + its codegen/AI
# (`codegen`) and live-sync (`live-sync`) supersets, plus the from-scratch
# WebGL2 Ganesh backend (`webgl`) + gl-webgl-shim. CanvasKit is the only web
# renderer now; all their functionality was absorbed into `canvaskit` and the
# skia-only raster modules were deleted. `skia-safe` reverted to upstream
# crates.io — it has no wasm32-unknown-unknown target, so a wasm skia build is
# no longer possible regardless.)
