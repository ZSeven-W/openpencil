[build]
# wasm32 target enabled via rust-toolchain.toml; no override here

[net]
git-fetch-with-cli = true

[term]
verbose = false

# ---- OpenHarmony (OHOS) cross-compilation --------------------------------
#
# `scripts/build-ohos.sh` is the supported entry point: it verifies
# OHOS_NDK_HOME, adds the rustup target, and exports the CC/CXX/AR/CFLAGS that
# the `cc` crate and skia-bindings read. These two sections only cover what
# cargo itself needs — the linker driver — so that a bare
# `cargo build --target aarch64-unknown-linux-ohos` from the REPO ROOT also
# links. Cargo resolves a relative `linker` against the current working
# directory, which is why the build script additionally exports the absolute
# `CARGO_TARGET_*_LINKER` override (env beats config, so it always wins).
#
# `[target.<triple>].ar` is deliberately absent: cargo ignores it. Archiver
# selection goes through the `AR_<triple>` env var that `cc` reads, set by
# scripts/build-ohos.sh.

[target.aarch64-unknown-linux-ohos]
linker = "scripts/ohos/ohos-clang-aarch64.sh"

[target.x86_64-unknown-linux-ohos]
linker = "scripts/ohos/ohos-clang-x86_64.sh"

[alias]
# Native desktop dev loop — incremental rebuild + relaunch on save
# (needs `cargo install cargo-watch`). Pass extra binary args after `--`,
# e.g. `cargo dev-desktop -- --live-mcp`.
dev-desktop = ["watch", "-w", "crates", "-w", "vendor", "--", "cargo", "run", "-p", "op-host-desktop"]
# Fast UI inner loop — verify widget layout/paint geometry without
# launching a window (~0.05s).
test-ui = "test -p op-editor-ui"
